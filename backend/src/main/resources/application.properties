spring.application.name=kaam-mitra-backend

# PostgreSQL configuration (override with environment variables in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kaam_mitra_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# JWT configuration (override JWT_SECRET in production)
app.jwt.secret=${JWT_SECRET:KaamMitraDevSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# File upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Platform commission percentage (e.g. 10%)
app.platform.commission-rate=${PLATFORM_COMMISSION_RATE:0.10}

# Matching radius in kilometers
app.matching.radius-km=${MATCHING_RADIUS_KM:25.0}

# Optional Firebase Admin service account JSON path for FCM
app.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:}

# Development seed accounts (disable in production)
app.seed.enabled=${SEED_ENABLED:true}
